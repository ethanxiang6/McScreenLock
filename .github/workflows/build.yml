name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  TRINKETS_TAG: "4.1.1+26.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build Trinkets ${{ env.TRINKETS_TAG }} into mavenLocal
        run: |
          git clone --depth 1 --branch "$TRINKETS_TAG" https://github.com/Patbox/trinkets trinkets-src
          cd trinkets-src
          chmod +x gradlew
          ./gradlew publishToMavenLocal -x test

      - name: Build companion mod
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Commit build output back to branch
        if: always()
        run: |
          mkdir -p build-output
          cp -f build.log build-output/ 2>/dev/null || true
          cp -f build/libs/inventoryhud-trinkets-elytra-*.jar build-output/ 2>/dev/null || true
          rm -f build-output/*-sources.jar
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f build-output
          git commit -m "build output [skip ci]" || exit 0
          git push
