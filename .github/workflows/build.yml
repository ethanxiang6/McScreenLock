name: build-mc-26.2-mods
on:
  push:
    branches: [mc-26.2-mods]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/loom-cache
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build Trinkets and publish to mavenLocal
        working-directory: trinkets-26.2
        run: |
          chmod +x gradlew
          ./gradlew build publishToMavenLocal --stacktrace 2>&1 | tee ../trinkets-build.log

      - name: Build Elytra Slot
        working-directory: elytraslot-26.2
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee ../elytraslot-build.log

      - name: Collect jars
        if: success()
        run: |
          mkdir -p dist
          cp trinkets-26.2/build/libs/trinkets-*.jar dist/ 
          cp elytraslot-26.2/build/libs/elytraslot-*.jar dist/
          rm -f dist/*-sources.jar
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mc-26.2-jars
          path: dist/*.jar

      - name: Commit build output back to branch
        if: always()
        run: |
          mkdir -p build-output
          cp -f trinkets-build.log elytraslot-build.log build-output/ 2>/dev/null || true
          cp -f dist/*.jar build-output/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f build-output
          git commit -m "build output [skip ci]" || exit 0
          git push
