name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Commit build output back to branch
        if: always()
        run: |
          mkdir -p build-output
          cp -f build.log build-output/ 2>/dev/null || true
          cp -f build/libs/fallingtree-nocap-*.jar build-output/ 2>/dev/null || true
          rm -f build-output/*-sources.jar
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f build-output
          git commit -m "build output [skip ci]" || exit 0
          git push
