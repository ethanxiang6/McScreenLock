name: build-elytratrails-emf-fix
on:
  push:
    branches: [elytratrails-emf-fix]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Commit build output back to branch
        if: always()
        run: |
          mkdir -p build-output
          cp -f build.log build-output/ 2>/dev/null || true
          cp -f build/libs/elytratrails-*.jar build-output/ 2>/dev/null || true
          rm -f build-output/*-sources.jar
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f build-output
          git commit -m "build output [skip ci]" || exit 0
          git push
